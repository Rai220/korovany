<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#171817" />
    <title>Корованы — gpt-6.2-astra</title>
    <link rel="icon" href="./assets/mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="bar">
      <div class="bar-inner">
        <a class="brand" href="#campaign" aria-label="Корованы — gpt-6.2-astra"
          ><span class="brand-mark" data-icon="brand"></span>
          <h1 class="brand-text"><strong>Корованы</strong><small>gpt-6.2-astra</small></h1></a
        >
        <nav aria-label="Главное меню">
          <button data-page="campaign" class="active"><i data-icon="swords"></i>Кампания</button
          ><button data-page="atlas"><i data-icon="map"></i>Карта мира</button
          ><button id="help"><i data-icon="keys"></i>Управление</button>
        </nav>
        <div class="utilities">
          <button id="audio" class="icon-button" aria-label="Включить звук" title="Включить звук"></button
          ><button id="full" class="icon-button" aria-label="Полный экран" title="Полный экран">
            <i data-icon="expand"></i>
          </button>
        </div>
      </div>
    </header>
    <main id="menu">
      <section id="campaign">
        <div class="section-line">
          <span class="eyebrow">Главное меню</span><span class="rule"></span><i class="tiny-diamond"></i>
        </div>
        <h2 class="menu-title">Новая кампания</h2>
        <div class="campaign-grid">
          <article class="portrait" id="hero">
            <div id="hero-art"></div>
            <div class="hero-shade"></div>
            <div class="hero-frame"></div>
            <div class="hero-tag">
              <span class="red-diamond"></span><span id="plate-index">ФРАКЦИЯ I / III</span>
            </div>
            <div class="hero-caption">
              <div class="flourish"><b></b><span>◆</span><b></b></div>
              <h2 id="hero-name">Лесные эльфы</h2>
              <p id="hero-desc"></p>
              <span class="location"><i data-icon="pin"></i><span id="hero-location"></span></span>
            </div>
          </article>
          <section class="selection">
            <div class="section-line">
              <span class="eyebrow">Создание героя</span><span class="rule"></span>
            </div>
            <h2>Выберите сторону</h2>
            <div id="factions" role="group" aria-label="Фракция героя"></div>
            <button class="primary" id="begin">
              <i data-icon="swords"></i>Начать кампанию<i data-icon="arrow"></i>
            </button>
            <button class="resume" id="resume">Загрузить сохранение</button>
          </section>
        </div>
      </section>
      <section id="atlas">
        <div class="atlas-head">
          <i data-icon="compass"></i>
          <h2>Атлас мира</h2>
          <span class="rule"></span><span class="region-count">4 региона</span>
        </div>
        <div id="regions"></div>
      </section>
    </main>
    <footer id="footer">
      <span><i class="tiny-diamond"></i> Корованы</span><span>gpt-6.2-astra</span>
    </footer>
    <section id="play" hidden aria-label="Игровой мир">
      <div id="view"></div>
      <div class="bearing" aria-hidden="true"><span>◇</span><b id="compass-dir">С</b><span>◇</span></div>
      <div id="blind" hidden></div>
      <div id="hurt"></div>
      <div class="cross"></div>
      <div id="foe" hidden>
        <span id="foe-name"></span><progress id="foe-hp" value="1" max="1"></progress>
      </div>
      <div class="hud top-hud">
        <div class="eyebrow" id="side-label"></div>
        <strong id="area"></strong><small id="quest"></small><small id="direction"></small>
      </div>
      <button id="pause" class="hud-btn">Меню <kbd>Esc</kbd></button
      ><button id="map-key" class="hud-btn">Карта <kbd>M</kbd></button>
      <div id="event" role="status"></div>
      <div id="interact"></div>
      <div class="hud vitals">
        <div class="vital-line"><span>Здоровье</span><b id="hp"></b></div>
        <div class="meter"><b id="hpbar"></b></div>
        <small id="supplies"></small><small id="condition"></small>
      </div>
      <div class="hud hints">
        <span><kbd>ЛКМ</kbd> Удар</span><span><kbd>E</kbd> Действие</span><span><kbd>H</kbd> Перевязка</span>
      </div>
      <div id="touch-controls">
        <div id="stick" aria-label="Виртуальный джойстик"><i></i></div>
        <div class="touch-actions">
          <button data-key="KeyE">Действие</button><button data-key="Space">Прыжок</button
          ><button data-key="KeyH">Бинт</button><button data-key="KeyF">Удар</button
          ><button data-key="KeyQ" id="touch-order">Приказ</button>
        </div>
      </div>
    </section>
    <dialog id="dialog">
      <div class="modal-top">
        <span class="eyebrow" id="dialog-kicker"></span
        ><button class="icon-button" id="close" aria-label="Закрыть"><i data-icon="close"></i></button>
      </div>
      <h2 id="dialog-title"></h2>
      <div id="dialog-body"></div>
    </dialog>
    <div id="message" role="status"></div>
    <script src="./interface.js"></script>
    <script src="./vendor/three.min.js"></script>
    <script src="./world.js"></script>
    <script src="./game.js"></script>
  </body>
</html>
